name: Release builds

# Builds installers for Windows, macOS and Linux and attaches them to a GitHub release.
# Trigger: push a tag like v0.2.0, or run it manually and give an existing/new tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if it does not exist
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "fyrno7 $TAG" --notes-file .github/release-notes.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build bundles
        working-directory: src-tauri
        env:
          NO_STRIP: "true"
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload bundles with stable file names
        shell: bash
        run: |
          B=$(find src-tauri/target -type d -path "*release/bundle" | head -1)
          echo "bundle dir: $B"; find "$B" -maxdepth 2 -type f | sort
          case "$RUNNER_OS" in
            macOS)
              cp "$B"/dmg/*.dmg fyrno7-macos-universal.dmg
              gh release upload "$TAG" fyrno7-macos-universal.dmg --clobber ;;
            Linux)
              cp "$B"/appimage/*.AppImage fyrno7-linux-x86_64.AppImage
              cp "$B"/deb/*.deb fyrno7-linux-amd64.deb
              cp "$B"/rpm/*.rpm fyrno7-linux-x86_64.rpm
              gh release upload "$TAG" fyrno7-linux-x86_64.AppImage fyrno7-linux-amd64.deb fyrno7-linux-x86_64.rpm --clobber ;;
            Windows)
              cp src-tauri/target/release/fyrno7.exe fyrno7-windows-x64.exe
              cp "$B"/nsis/*-setup.exe fyrno7-windows-x64-setup.exe
              cp "$B"/msi/*.msi fyrno7-windows-x64.msi
              gh release upload "$TAG" fyrno7-windows-x64.exe fyrno7-windows-x64-setup.exe fyrno7-windows-x64.msi --clobber ;;
          esac
