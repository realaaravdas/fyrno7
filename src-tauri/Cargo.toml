[package]
name = "fyrno7"
version = "0.3.0"
description = "Annotate research papers like a human reader, powered by a local LLM"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pdf-extract = "0.7"
regex = "1"
once_cell = "1"
ocrs = "0.14.0"
rten = "0.28.0"
rten-imageproc = "0.28.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# OCR neural nets are slow in unoptimised builds; keep them fast during `cargo test`/`cargo run`.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
